        body {

        }

        .titulo {

            justify-content: center;

            color: #fff;
        }

        .divPai {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fff;
            width: 600px;
            height: 300px;
            border-radius: 10%;
        }

        .footer {
            color: #fff;
            margin-top: 10px;
        }

</head>
<body onload="carregar()" class="corpo">

        <h1 class="titulo">Hora do dia</h1>
    </header>
    <section>

    </div>

    <div class="divFilho" id="divFilho">

    <p class="footer">&copy;Gabriel C Costa</p>
