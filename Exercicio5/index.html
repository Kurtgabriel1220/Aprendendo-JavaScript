<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprendendo JavaScript</title>
    <style>
        body {
            font: normal 18pt Arial
        }

        input {
            font: normal 18pt Arial;
            width: 200px
        }
    </style>
    
</head>
<body>
    <h1>Somando valores</h1>
    <input type="number" name="txtn1" id="txtn1">
    +
    <input type="number" name="txtn2" id="txtn2">
    <input type="button" value="somar" onclick="somar()">
    <div id="resultado"></div>
    <footer>
        <p>&copy;Gabriel C Costa</p>
    </footer>

    <a class='botao' target="_blank" href="/Exercicio6/index.html">Proximo</a>
    
    <script>
        function somar() {
            let tn1 = document.getElementById('txtn1')
            /* let tn2 = document.getElementById('txtn2') */
            let tn2 = document.querySelector('input#txtn2')
            let n1 = Number(tn1.value)
            let n2 = Number(tn2.value)
            let soma = n1 + n2
            let resultado = document.getElementById('resultado')
            resultado.innerHTML = `A soma entre ${n1} e ${n2} E de <strong>${soma}</strong>`
        }
        </script>
</body>
</html>
