<!DOCTYPE html>
<html lang="en">
<head>

    <title>Aprendendo JavaScript</title>
    <style>

        }

        }

        #input {

        }

            <p>Numeero: <input type="number" name="num" id="txn">

        <div class="div2">

            </div>

    </section>
    <footer>
