<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>
    <style>
        div#area {
            font: normal 20pt Arial;
            background-color: green;
            color: #fff;
            width: 200px;
            height: 200px;
            line-height: 200px;
            text-align: center;
        }
        div#area1 {
            font: normal 20pt Arial;
            background-color: green;
            color: #fff;
            width: 200px;
            height: 200px;
            line-height: 200px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="area" onclick="lero()" onmouseenter="entrar()" onmouseout="sair()">
        Interaja...
    </div>
    <div id="area1">
        Interaja...
    </div>


    <script>
        let a = document.getElementById('area1')
        a.addEventListener('click', lero2)
        a.addEventListener('mouseenter', entrar1)
        a.addEventListener('mouseout', sair1)


        function lero2() {
            let a = document.getElementById('area1')
            a.innerText = 'clicou' 
        }

        function entrar1() {
            let entrar1 = document.getElementById('area1')
            entrar1.style.background = 'black'
            area.innerText = 'entrou'
        }

        function sair1() {
            let sair1 = document.getElementById('area1')
            sair1.style.background = 'green'
            sair1.innerText = 'saiu'
        }






        function lero() {
            let area = document.getElementById('area')
            area.innerText = 'clicou' 
        }

        function entrar() {
            let entrar = document.getElementById('area')
            entrar.style.background = 'black'
            area.innerText = 'entrou'
        }


        function sair() {
            let sair = document.getElementById('area')
            sair.style.background = 'green'
            sair.innerText = 'saiu'
        }
    </script>
</body>
</html>
